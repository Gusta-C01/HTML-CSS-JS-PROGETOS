<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>videos com HTML5</title>
</head>
<body>
    <h1>inserindo videos hospedados localmente</h1>
    <p>Este videeo esta hospedado no meu proprio servidor.</p>

     <video width="560" poster="imagens/limoes-capa.png" controls loop>
        <source src="midia/meu-video.mp4">
        <source src="midia/Meu-Video.webm">
        <p>Seu navegador não tem compatibilidade com reprodução do videos</p>
     </video>
     <h1>Inserindo videos do YOUTUBE</h1>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/jPWsBuiy1rE?si=CvBZdJqtlyFTkLDY" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
